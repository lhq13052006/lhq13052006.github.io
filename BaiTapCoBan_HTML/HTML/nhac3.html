<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Furina Album - Track 3</title>
    <style>
        body {
            background: #0f1c2e linear-gradient(135deg, #0f1c2e 0%, #1b355a 100%);
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            padding-top: 60px;
            color: #f1faee;
            margin: 0;
        }
        .player-card {
            background: rgba(15, 32, 58, 0.85);
            border: 2px solid #457b9d;
            border-radius: 16px;
            padding: 30px;
            width: 340px;
            margin: 0 auto;
            box-shadow: 0 12px 32px rgba(0,0,0,0.5);
            cursor: pointer;
        }
        .fontaine-title {
            font-size: 11px; color: #a8dadc; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 20px;
        }
        .vinyl-container { width: 170px; height: 170px; margin: 0 auto 20px; }
        .vinyl-disc {
            width: 100%; height: 100%; border-radius: 50%;
            background-image: url("Images/furina3.jpg");
            background-size: cover; background-position: center;
            border: 5px solid #457b9d; position: relative;
            animation: spin 12s linear infinite;
            animation-play-state: paused;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .vinyl-disc::after {
            content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 20px; height: 20px; background: #0f1c2e; border-radius: 50%; border: 2px solid #a8dadc;
        }
        .song-name { font-size: 20px; font-weight: bold; color: #ffffff; margin: 10px 0 5px; }
        .artist { font-size: 13px; color: #a8dadc; margin-bottom: 20px; }
        .tip-click { font-size: 12px; color: #8d99ae; font-style: italic; }
    </style>
</head>
<body>

    <!-- Thẻ âm thanh bài 3 -->
    <audio src="../../Character Demo - Furina All the World's a Stage  Genshin Impact - Genshin Impact.mp3" loop id="bg-music"></audio>

    <div class="player-card" id="player">
        <div class="fontaine-title">Opéra Epiclèse Audio System</div>
        <div class="vinyl-container">
            <div class="vinyl-disc" id="disc"></div>
        </div>
        <div class="song-name">All the world's a Stage</div>
        <div class="artist">Furina — Thế giới tựa sân khấu</div>
        <div class="tip-click" id="status-text">Bấm vào đây để Phát / Dừng nhạc 💧</div>
    </div>

    <script>
        var music = document.getElementById('bg-music');
        var player = document.getElementById('player');
        var disc = document.getElementById('disc');
        var statusText = document.getElementById('status-text');

        function togglePlay() {
            if (music.paused) {
                music.play().then(function() {
                    disc.style.animationPlayState = 'running';
                    statusText.innerText = 'Đang phát nhạc của Furina... ✨';
                }).catch(function(error) {
                    console.log("Trình duyệt chặn phát: " + error);
                });
            } else {
                music.pause();
                disc.style.animationPlayState = 'paused';
                statusText.innerText = 'Đã tạm dừng nhạc.';
            }
        }

        player.addEventListener('click', togglePlay);
    </script>

</body>
</html>
