<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Fontaine Hydro Audio Player</title>
    <style>
        /* Thiết lập nền tối huyền bí và hiệu ứng chuyển màu chuẩn không gian Fontaine */
        body {
            background: #0f1c2e linear-gradient(135deg, #0f1c2e 0%, #1b355a 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: block;
            text-align: center;
            padding-top: 50px;
            color: #f1faee;
            margin: 0;
        }

        /* Khung ứng dụng phát nhạc */
        .player-card {
            background: rgba(15, 32, 58, 0.85);
            border: 2px solid #457b9d;
            border-radius: 16px;
            padding: 30px;
            width: 360px;
            margin: 0 auto;
            box-shadow: 0 12px 32px rgba(0,0,0,0.5);
            cursor: pointer; /* Hiển thị ngón tay để nhắc người dùng click */
            position: relative;
        }

        /* Tiêu đề mang phong cách viện hàn lâm Fontaine */
        .fontaine-title {
            font-size: 11px;
            color: #a8dadc;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        /* Khung chứa đĩa nhạc */
        .vinyl-container {
            width: 170px;
            height: 170px;
            margin: 0 auto 20px;
            position: relative;
        }

        /* Chiếc đĩa than có ảnh Furina ở chính giữa */
        .vinyl-disc {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            
            /* GẮN ẢNH VÀO ĐÂY: Tự động căn giữa và bo tròn ảnh */
            background-image: url("Images/furina1.jpg");
            background-size: cover;
            background-position: center;
            
            /* Viền xanh ngọc hoàng gia bọc ngoài tấm ảnh */
            border: 5px solid #457b9d;
            box-shadow: 0 0 15px rgba(69, 123, 157, 0.5);
            position: relative;
            
            /* Hiệu ứng xoay tròn liên tục (mặc định sẽ tạm dừng cho đến khi click) */
            animation: spin 12s linear infinite;
            animation-play-state: paused; 
        }

        /* Định nghĩa chuyển động xoay tròn 360 độ */
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* Tạo một lỗ tròn nhỏ (tâm đĩa) màu đen ở chính giữa tấm ảnh để giống đĩa than thật */
        .vinyl-disc::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            background: #0f1c2e;
            border-radius: 50%;
            border: 2px solid #a8dadc;
        }

        /* Thông tin bài hát và nghệ sĩ */
        .song-name {
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
            margin: 10px 0 5px;
        }

        .artist {
            font-size: 13px;
            color: #a8dadc;
            margin-bottom: 25px;
        }

        /* Thanh thời gian (tiến trình bài hát) */
        .progress-bar {
            background: rgba(255,255,255,0.1);
            height: 5px;
            border-radius: 3px;
            margin-bottom: 25px;
        }

        .progress-fill {
            background: #457b9d;
            width: 0%; /* Sẽ tự động tăng dần khi nhạc chạy */
            height: 100%;
            border-radius: 3px;
            transition: width 0.1s linear;
        }

        /* Các nút bấm điều khiển */
        .audio-controls button {
            background: none;
            border: none;
            color: #f1faee;
            font-size: 22px;
            margin: 0 15px;
            cursor: pointer;
        }

        .audio-controls .play-main {
            color: #457b9d;
            font-size: 34px;
        }
        
        /* Dòng chữ gợi ý tương tác ở dưới cùng */
        .tip-click {
            font-size: 12px;
            color: #8d99ae;
            margin-top: 15px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <audio src="../../La vaguelette - HOYO-MiX.mp3" loop id="bg-music"></audio>

    <div class="player-card" id="player">
        <div class="fontaine-title">Opéra Epiclèse Sound System</div>
        
        <div class="vinyl-container">
            <div class="vinyl-disc" id="disc"></div>
        </div>
        
        <div class="song-name">La Vaguelette</div>
        <div class="artist">Furina (Lady Focalors) — Fontaine</div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>
        
        <div class="audio-controls">
            <button>⏮</button>
            <button class="play-main" id="play-btn">▶</button>
            <button>⏭</button>
        </div>
        
        <div class="tip-click" id="status-text">Bấm vào đây để nghe nhạc của Furina 💧</div>
    </div>

    <script>
        const music = document.getElementById('bg-music');
        const player = document.getElementById('player');
        const disc = document.getElementById('disc');
        const playBtn = document.getElementById('play-btn');
        const progress = document.getElementById('progress');
        const statusText = document.getElementById('status-text');

        // Hàm điều khiển phát/tạm dừng
        function togglePlay(e) {
            if (music.paused) {
                // Đổi thành function() truyền thống để Dreamweaver CS6 hiểu được
                music.play().then(function() {
                    disc.style.animationPlayState = 'running'; 
                    playBtn.innerText = '⏸'; 
                    statusText.innerText = 'Đang phát ca khúc của Furina... ✨';
                }).catch(function(error) {
                    console.log("Trình duyệt yêu cầu tương tác trước: " + error);
                });
            } else {
                music.pause();
                disc.style.animationPlayState = 'paused'; 
                playBtn.innerText = '▶'; 
                statusText.innerText = 'Đã tạm dừng nhạc.';
            }
        }

        // Kích hoạt click cho toàn bộ khung ứng dụng
        player.addEventListener('click', togglePlay);

        // Cập nhật thanh thời gian chạy theo thời gian thực của bài hát
        music.addEventListener('timeupdate', function() {
            if (music.duration) {
                const percentage = (music.currentTime / music.duration) * 100;
                progress.style.width = percentage + '%';
            }
        });
    </script>

</body>
</html>
