<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>frame_AboutMe</title>
<style>
    /* 1. Định dạng nền chân trang thẫm màu đồng bộ với website */
    body {
        background-color: #0d192b !important; /* Xanh đen thẫm Fontaine */
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh; /* Căn giữa chữ theo chiều dọc khung hình */
        font-family: 'Segoe UI', Arial, sans-serif;
        overflow: hidden;
        border-top: 2px solid #457b9d; /* Vạch xanh ngọc mỏng ngăn cách với phần nội dung trên */
    }

    /* 2. Định dạng dòng chữ bản quyền lấp lánh */
    .footer-text {
        color: #e0f1f1 !important; /* Chữ trắng xanh dịu mát, cực dễ đọc */
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 2px; /* Giãn chữ sang trọng */
        text-transform: uppercase;
        text-shadow: 0 0 8px rgba(168, 218, 220, 0.5);
    }

    /* Làm nổi bật tên của bạn bằng màu vàng Hoàng Gia */
    .footer-text span {
        color: #ffb703; 
        font-weight: bold;
    }
</style>
</head>
<body>

    <!-- Dòng chữ footer mới gọn gàng và nghệ thuật -->
    <div class="footer-text">
     © Designed by <span>Le Hoang Quan</span></div>

</body>
</html>
