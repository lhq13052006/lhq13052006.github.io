<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            background-color: #f0f4f8; /* Nền xám xanh dịu mát, không bị trống trải */
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80vh;
            margin: 0;
        }

        /* Chiếc hộp thông tin hoàng gia */
        .card-profile {
            background: #ffffff;
            border-top: 6px solid #457b9d; /* Thanh màu chủ đạo của Thủy Thần */
            border-radius: 12px;
            padding: 40px 60px;
            box-shadow: 0 10px 30px rgba(13, 25, 43, 0.08);
            text-align: center;
        }

        .card-profile h2 {
            color: #1d3557; /* Xanh Navy thẫm cực rõ nét */
            font-size: 24px;
            margin-bottom: 25px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .info-line {
            font-size: 16px;
            color: #457b9d;
            margin: 12px 0;
            text-align: left;
            font-weight: 500;
        }

        .info-line span {
            color: #1d3557;
            font-weight: bold;
            margin-left: 5px;
        }
    </style>
</head>
<body>

    <div class="card-profile">
        <h2>THÔNG TIN LIÊN HỆ</h2>
        <div class="info-line">👤 Họ và Tên: <span>Lê Hoàng Quân</span></div>
        <div class="info-line">🏫 Lớp học: <span>CN24CD</span></div>
        <div class="info-line">📞 Điện thoại: <span>0785131246</span></div>
        <div class="info-line">✉️ Gmail: <span>lhq13052006@gmail.com</span></div>
    </div>

</body>
</html>
