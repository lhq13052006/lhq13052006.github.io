<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Untitled Document</title>
<style>
  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-top: 50px;
  }
  .nut-group {
    display: flex;
    gap: 40px;
  }
  .nut-group input {
    padding: 8px 20px;
    cursor: pointer;
  }
</style>
</head>

<body>

<div class="container">
  <img src="images/den_tat.png" name="my_image" id="my_image" />
  <div class="nut-group">
    <input name="tat" type="button" id="tat" value="Pneuma" onclick="document.getElementById('my_image').src='images/den_tat.png'" />
    <input name="mo" type="button" id="mo" value="Ousia" onclick="document.getElementById('my_image').src='images/den_sang.PNG'" />
  </div>
</div>

</body>
</html>
