<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tổng hợp các bài tập Javascript</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .bai-tap {
      margin-bottom: 30px;
      padding-bottom: 20px;
    }
  </style>
</head>
<body>

  <!-- BÀI 1: THÔNG TIN LIÊN HỆ -->
  <div class="bai-tap">
    <script>
      document.writeln("<center><h3> Bài 1. Mọi chi tiết xin vui lòng liên hệ </h3>");
      document.writeln("<hr />");
      document.writeln("Lê Hoàng Quân<br />");
      document.writeln("Trường Cao đẳng Kỹ thuật - Công nghệ Đồng Nai<br />");
      document.writeln("Điện thoại: 0785 131 246<br />");
      document.writeln("Email: lhq13052006@gmail.com</center>");
    </script>
  </div>

  <hr>

  <!-- BÀI 2 & BÀI 3: MÁY TÍNH BỎ TÚI -->
  <div class="bai-tap">
    <center>
      <table border="0">
        <caption>
          <h3>Bài 2 & 3. Làm quen với các phép toán</h3>
        </caption>
        <tbody>
          <tr>
            <td>Nhập số thứ 1</td>
            <td><input type="text" id="txtso1"></td>
          </tr>
          <tr>
            <td>Nhập số thứ 2</td>
            <td><input type="text" id="txtso2"></td>
          </tr>
          <tr>
            <td>Phép toán</td>
            <td>
              <input type="button" name="cong" id="cong" value="+">
              <input type="button" name="tru" id="tru" value="-">
              <input type="button" name="nhan" id="nhan" value="x">
              <input type="button" name="chia" id="chia" value="/">
            </td>
          </tr>
          <tr>
            <td>Kết quả:</td>
            <td><p id="ketqua" style="font-weight: bold"></p></td>
          </tr>
        </tbody>
      </table>
    </center>
  </div>

  <hr>

  <!-- BÀI 4: LỜI CHÀO THEO GIỜ -->
  <div class="bai-tap" style="text-align: center;">
    <h3>Bài 4. Lời chào theo giờ hệ thống</h3>
    <h4 id="loi-chao" style="color: blue;"></h4>
  </div>

  <hr>

  <!-- BÀI 5: ĐỒNG HỒ HỆ THỐNG -->
  <div class="bai-tap" style="text-align: center;">
    <h3>Bài 5. Đồng hồ hệ thống</h3>
    <div id="dong-ho" style="font-size: 2rem; font-weight: bold; font-family: monospace;">
      00:00:00
    </div>
  </div>
  
   <hr>

  <div class="bai-tap" style="text-align: center;">
    <h3>Bài 6. Ngày giờ hệ thống</h3>
    <span id="ngay"></span>, <span id="dong-ho-6">00:00:00</span>
  </div>

  <script>
    var theKetQua = document.getElementById("ketqua");

    document.getElementById("cong").onclick = function() {
      var so1 = Number(document.getElementById("txtso1").value);
      var so2 = Number(document.getElementById("txtso2").value);
      theKetQua.innerHTML = so1 + so2;
    };

    document.getElementById("tru").onclick = function() {
      var so1 = Number(document.getElementById("txtso1").value);
      var so2 = Number(document.getElementById("txtso2").value);
      theKetQua.innerHTML = so1 - so2;
    };

    document.getElementById("nhan").onclick = function() {
      var so1 = Number(document.getElementById("txtso1").value);
      var so2 = Number(document.getElementById("txtso2").value);
      theKetQua.innerHTML = so1 * so2;
    };

    document.getElementById("chia").onclick = function() {
      var so1 = Number(document.getElementById("txtso1").value);
      var so2 = Number(document.getElementById("txtso2").value);
      if (so2 === 0) {
        theKetQua.innerHTML = "Lỗi: Không thể chia cho 0!";
      } else {
        theKetQua.innerHTML = so1 / so2;
      }
    };

    var d = new Date();
    var time = d.getHours();
    var loiChaoText = "";

    if (time < 10) {
      loiChaoText = "Chào buổi sáng";
    } else if (time < 17) {
      loiChaoText = "Chào buổi chiều";
    } else {
      loiChaoText = "Chào buổi tối";
    }
    document.getElementById("loi-chao").innerText = loiChaoText;

    function capNhatDongHo() {
      const bayGio = new Date();
      const chuoiThoiGian = bayGio.toLocaleTimeString('vi-VN');
      if(document.getElementById('dong-ho-5')) {
        document.getElementById('dong-ho-5').innerText = chuoiThoiGian;
      }
      if(document.getElementById('dong-ho-6')) {
        document.getElementById('dong-ho-6').innerText = chuoiThoiGian;
      }
    }

    capNhatDongHo();
    setInterval(capNhatDongHo, 1000);
  </script>

</body>
</html>
